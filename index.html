<style>
*{box-sizing:border-box;-webkit-font-smoothing:antialiased;}
.wrap{max-width:1120px;margin:0 auto;padding:24px 18px 60px;}
.tabnums{font-variant-numeric:tabular-nums;}
/* top-level section tabs */
.sectiontabs{display:flex;gap:6px;background:#0f2033;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:6px;margin:0 auto 20px;width:fit-content;}
.stab{padding:9px 22px;border-radius:9px;cursor:pointer;text-align:center;transition:all .15s ease;color:#cfd8e3;}
.stab .s-label{font-family:'Oswald',sans-serif;font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.5px;}
.stab .s-sub{font-size:10.5px;color:#8a99aa;margin-top:1px;}
.stab[data-active="true"]{background:#45d62e;color:#04305a;box-shadow:0 3px 10px rgba(69,214,46,.35);}
.stab[data-active="true"] .s-sub{color:#05320f;}
.tabs{display:flex;gap:8px;margin:0 0 16px;}
.tab{flex:1;text-align:center;padding:13px 10px;border-radius:12px;cursor:pointer;transition:all .15s ease;}
.tab .t-day{font-weight:800;font-size:15px;} .tab .t-date{font-size:12.5px;margin-top:1px;}
.single-note{margin:0 0 16px;font-size:13px;color:#9fd8f4;}
table{width:100%;border-collapse:collapse;}
thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:12px 14px;font-weight:700;white-space:nowrap;}
tbody td{padding:12px 14px;font-size:14px;vertical-align:top;}
.time{font-weight:700;white-space:nowrap;} .topic{font-weight:600;} .outcome{font-size:13px;margin-top:2px;}
.outcome-cell{font-size:13px;color:#45596e;}
.meta{font-size:12.5px;white-space:nowrap;} .dur{font-size:12.5px;white-space:nowrap;font-weight:600;}
.now-badge{display:inline-block;margin-left:8px;font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.05em;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.5;}}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin:14px 2px 0;font-size:12.5px;}
.legend .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle;}
.foot{text-align:center;font-size:12.5px;margin-top:26px;}
.foot .vo{display:inline-block;border-radius:999px;padding:5px 12px;font-weight:600;}
.flag{margin-right:5px;}
.pi-pill{float:right;padding:7px 14px;border-radius:999px;font-size:13px;font-weight:700;}
@media(max-width:720px){h1{font-size:26px!important;}.meta.hide-sm,th.hide-sm,td.hide-sm{display:none;}}
@media print{.tabs,.sectiontabs,.foot .vo{display:none;}.day-panel{display:block!important;page-break-inside:avoid;}}

.banner .tint{position:absolute;inset:0;background:linear-gradient(160deg,rgba(4,48,90,.72) 0%,rgba(0,32,73,.82) 55%,rgba(0,17,39,.92) 100%);}
.field-lines{position:absolute;inset:0;opacity:.06;background:repeating-linear-gradient(90deg,transparent,transparent 78px,#00aff4 78px,#00aff4 80px);}
.banner-inner{position:relative;padding:26px 28px 30px;}
.logo-chip{display:inline-flex;background:rgba(255,255,255,.96);border-radius:12px;padding:12px 18px;box-shadow:0 4px 14px rgba(0,0,0,.3);}
.logo-chip img{height:40px;display:block;}
.pi-pill{background:#45d62e;color:#04305a;border:none;}
h1{margin:20px 0 0;font-size:44px;color:#fff;text-shadow:2px 2px 6px rgba(0,0,0,.55);}
.theme{margin-top:6px;font-family:'Oswald',sans-serif;font-size:16px;letter-spacing:2px;text-transform:uppercase;color:#7fe36a;text-shadow:0 1px 4px rgba(0,0,0,.5);}
.zones{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;}
.zone{background:rgba(0,16,36,.5);border:1px solid rgba(0,175,244,.3);border-radius:12px;padding:12px 16px;min-width:200px;flex:1;backdrop-filter:blur(3px);}
.zone .z-label{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:#9fd8f4;}
.zone .z-city{font-size:14px;font-weight:600;margin-top:3px;color:#cfeeff;}
.zone .z-time{font-family:'Oswald',sans-serif;font-size:26px;font-weight:700;margin-top:2px;color:#fff;}
.section-wrap{margin-top:22px;}
.tab{background:#0f2b4a;border:1px solid rgba(0,175,244,.25);color:#cfeeff;}
.tab:hover{border-color:#00aff4;} .tab .t-date{color:#7fb8dc;}
.tab[data-active="true"]{background:#45d62e;color:#04305a;border-color:#45d62e;}
.tab[data-active="true"] .t-date{color:#04305a;}
.tab .t-day{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.5px;}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.35);}
thead th{color:#fff;background:#002049;} th.tz{color:#7fe36a;}
thead th.tz.ist-col{background:linear-gradient(135deg,#ff9933 0%,#ffffff 50%,#138808 100%)!important;color:#0b3f6b!important;text-shadow:0 1px 1px rgba(255,255,255,.6);border-bottom:none!important;}
tbody td{border-bottom:1px solid #e3e9f0;color:#0f2233;} tbody tr:last-child td{border-bottom:none;}
.time.ist{color:#0b3f6b;font-weight:700;}
td.ist-col{background:rgba(120,180,230,.48)!important;border-bottom:1px solid rgba(120,180,230,.48)!important;}
thead th.ist-col{background:rgba(90,155,215,.48)!important;color:#08315a;border-bottom:1px solid rgba(90,155,215,.48)!important;}
tr.now td.ist-col{background:rgba(105,170,225,.48)!important;}
.outcome{color:#45596e;} .meta,.dur{color:#7a8da0;}
tr td:first-child{border-left:4px solid transparent;}
tr.type-session td:first-child{border-left-color:#45d62e;} tr.type-session .topic{color:#1f2937;font-weight:600;} tr.type-session td{background:rgba(69,214,46,.16);} tr.type-session .time{color:#1f2937;}
tr.type-break td:first-child,tr.type-breakfast td:first-child,tr.type-lunch td:first-child{border-left-color:#e8a33d;}
tr.type-break .topic,tr.type-breakfast .topic,tr.type-lunch .topic{color:#1f2937;font-weight:700;}
tr.type-break td,tr.type-breakfast td,tr.type-lunch td{background:#fbe6c4;color:#1f2937;}
tr.type-break td.ist-col,tr.type-breakfast td.ist-col,tr.type-lunch td.ist-col{color:#1f2937;background:#f6d9a8!important;}
tr.type-break .time,tr.type-breakfast .time,tr.type-lunch .time{color:#1f2937;}

document.getElementById('foot-note').textContent='Rise Analytics, a Trellance Company · '+(DATA.eventYear||'');

// section tabs
const secEl=document.getElementById('sectiontabs');
DATA.sections.forEach((s,i)=>{ const t=document.createElement('div'); t.className='stab'; t.dataset.active=(i===0);
  t.innerHTML='<div class="s-label">'+s.label+'</div><div class="s-sub">'+(s.sublabel||'')+'</div>';
  t.onclick=()=>{activeSection=i;activeDay=0;render();}; secEl.appendChild(t); });

function render(){
  [...secEl.children].forEach((t,i)=>t.dataset.active=(i===activeSection));
  const sec = DATA.sections[activeSection];
  const hm = document.getElementById('hero-mode');
  if(hm){ hm.textContent = sec.id==='virtual' ? 'Virtual' : 'In-Person'; }
  const section=sec;
  const days=section.days;
  // day sub-tabs (only if >1 day)
  const tabsEl=document.getElementById('tabs');
  tabsEl.innerHTML='';
  if(days.length>1){
    days.forEach((d,i)=>{ const t=document.createElement('div'); t.className='tab'; t.dataset.active=(i===activeDay);
      t.innerHTML='<div class="t-day">'+d.name+'</div><div class="t-date">'+d.date+'</div>';
      t.onclick=()=>{activeDay=i;render();}; tabsEl.appendChild(t); });
    document.getElementById('single-note').textContent='';
  } else {
    document.getElementById('single-note').textContent=days[0].name+' · '+days[0].date;
  }
  const day=days[Math.min(activeDay,days.length-1)];
  const nowM=(()=>{const n=tzNow(-240);return n.getHours()*60+n.getMinutes();})();
  let nowIdx=-1;
  for(let i=0;i<day.sessions.length;i++){ const s=day.sessions[i], st=toMin(s.est); if(st===null)continue;
    const nx=day.sessions[i+1], en=nx?toMin(nx.est):st+60; if(nowM>=st&&nowM<en){nowIdx=i;break;} }
  let rows='';
  day.sessions.forEach((s,i)=>{ const now=i===nowIdx;
    const isBuf = s.type==='buffer';
    const usS=toMin(s.est), inS=toMin(s.ist), d=durMin(s.duration);
    const usStart=isBuf?'':(usS!==null?minToStr(usS):(s.est||'')), usEnd=isBuf?'':(usS!==null?minToStr(usS+d):'');
    const inStart=isBuf?'':(inS!==null?minToStr(inS):(s.ist||'')), inEnd=isBuf?'':(inS!==null?minToStr(inS+d):'');
    rows+='<tr class="type-'+s.type+(now?' now':'')+'">'+
      '<td><div class="topic">'+s.topic+(now?'<span class="now-badge">now</span>':'')+'</div></td>'+
      '<td class="outcome-cell">'+(s.outcome||'')+'</td>'+
      '<td class="time tabnums">'+usStart+'</td>'+
      '<td class="time tabnums">'+usEnd+'</td>'+
      '<td class="ist-col time ist tabnums">'+inStart+'</td>'+
      '<td class="ist-col time ist tabnums">'+inEnd+'</td></tr>';
    if(i < day.sessions.length-1){ const nxt=day.sessions[i+1]; if(s.type!=='buffer' && nxt.type!=='buffer'){ rows+='<tr class="spacer"><td colspan="6"></td></tr>'; } }
  });
  document.getElementById('panels').innerHTML=
    '<div class="card day-panel"><table><thead><tr>'+
    '<th>Topic</th><th>Outcome</th>'+
    '<th class="tz"><span class="flag">🇺🇸</span>EST Start</th><th class="tz">EST End</th>'+
    '<th class="tz ist-col"><span class="flag">🇮🇳</span>IST Start</th><th class="tz ist-col">IST End</th>'+
    '</tr></thead><tbody>'+rows+'</tbody></table></div>';
  // Event banner: show Shuffle board only on in-person Day 1
  const eb=document.getElementById('event-banner');
  if(eb){
    if(sec.id==='pi264' && activeDay===0){
      eb.innerHTML='<div class="event-banner"><div class="eb-skyline"></div><div class="eb-tint"></div>'+
        '<div class="eb-icon">🎯</div>'+
        '<div class="eb-text"><div class="eb-title">Shuffle board</div>'+
        '<div class="eb-sub">After Day 1 · Join the team to unwind and play a few rounds.</div></div></div>';
    } else if(sec.id==='pi264' && activeDay===1){
      eb.innerHTML='<div class="event-banner"><div class="eb-skyline"></div><div class="eb-tint"></div>'+
        '<div class="eb-icon">🎮</div>'+
        '<div class="eb-text"><div class="eb-title">In-office games</div>'+
        '<div class="eb-sub">After Day 2 · Stick around for some in-office games.</div></div></div>';
    } else { eb.innerHTML=''; }
  }
}
render(); setInterval(render,60000);
</script>



<script>
(function(){
  const bg=document.getElementById('bg-anim'); if(!bg) return;
  const c=document.createElement('canvas'); bg.appendChild(c);
  const x=c.getContext('2d'); let W,H,cols,drops,fs=16;
  const chars='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ<>/*+-アイウエオカキクケコサシスセソ';
  function rs(){W=c.width=innerWidth;H=c.height=innerHeight;cols=Math.floor(W/fs);drops=[];for(let i=0;i<cols;i++)drops[i]=Math.random()*-H/fs;}
  addEventListener('resize',rs); rs(); let frame=0;
  function step(){frame++;x.fillStyle='rgba(10,26,47,0.10)';x.fillRect(0,0,W,H);x.font=fs+'px monospace';
    for(let i=0;i<cols;i++){ if(frame%3===0){ const ch=chars[Math.floor(Math.random()*chars.length)];
      const px=i*fs,py=drops[i]*fs; x.fillStyle='rgba(69,214,46,0.16)';x.fillText(ch,px,py);
      x.fillStyle='rgba(120,240,110,0.30)';x.fillText(ch,px,py);
      if(py>H && Math.random()>0.985) drops[i]=Math.random()*-20; drops[i]+=(frame%3===0?1:0);}}
    requestAnimationFrame(step);}
  step();
})();
</script>
